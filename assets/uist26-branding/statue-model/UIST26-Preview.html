<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIST 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            position: relative;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(212, 165, 116, 0.08) 0%, transparent 70%);
            animation: glow 4s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes glow {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        /* File selector - minimal design */
        #file-selector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }
        
        #file-selector.hidden {
            display: none;
        }
        
        #file-input {
            display: none;
        }
        
        #select-btn {
            padding: 20px 40px;
            background: rgba(212, 165, 116, 0.2);
            border: 2px solid #d4a574;
            color: #d4a574;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        #select-btn:hover {
            background: rgba(212, 165, 116, 0.4);
            border-color: #c9a869;
            transform: scale(1.05);
        }
        
        /* Loading spinner */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 4px solid rgba(212, 165, 116, 0.2);
            border-top: 4px solid #d4a574;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 100;
            display: none;
        }
        
        #loading.active {
            display: block;
        }
        
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- File selector -->
    <div id="file-selector">
        <input type="file" id="file-input" accept=".obj">
        <button id="select-btn">Select OBJ File</button>
    </div>
    
    <!-- Loading indicator -->
    <div id="loading"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';


        
        const CONFIG = {
            material: {
                color: 0xcea665,           
                metalness: 0.92,          
                roughness: 0.18,           
                emissive: 0x8b6f47,        
                emissiveIntensity: 0.3    
            },
            
            model: {
                position: { x: 0, y: 0, z: 0 },     
                rotation: { x: 0, y: 0 , z:  0  },    
                scale: 1.5,                            
                autoRotate: true,                    
                rotateSpeed: 0.001                 
            },
            
            lighting: {
                ambientIntensity: 0.4,      
                keyLightIntensity: 2.5,     
                fillLightIntensity: 1.2,    
                rimLightIntensity: 3.0,    
                accentIntensity: 1.0,      
                dynamicLightEnabled: true,  
                shadowIntensity: 0.5       
            },
            
            camera: {
                autoAdjust: true,           
                fov: 45,                    
                initialDistance: 8          
            },
            
            animation: {
                autoRotateSpeed: 0.5,      
                floatEnabled: false,       
                floatSpeed: 0.3,
                floatAmount: 0.1
            }
        };
        

        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x292826);
        const camera = new THREE.PerspectiveCamera(
            CONFIG.camera.fov, 
            window.innerWidth / window.innerHeight, 
            0.1, 
            1000
        );
        camera.position.set(0, 1, CONFIG.camera.initialDistance * 1.5);  
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: false,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 2;
        controls.maxDistance = 50;
        controls.autoRotate = CONFIG.animation.autoRotateSpeed > 0;
        controls.autoRotateSpeed = CONFIG.animation.autoRotateSpeed;
        controls.maxPolarAngle = Math.PI / 1.8;  
        controls.minPolarAngle = Math.PI / 12;   

     
        
        const ambientLight = new THREE.AmbientLight(0xffffff, CONFIG.lighting.ambientIntensity);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, CONFIG.lighting.keyLightIntensity);
        keyLight.position.set(5, 8, 5);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        scene.add(keyLight);

        const fillLight = new THREE.PointLight(0xd4a574, CONFIG.lighting.fillLightIntensity);
        fillLight.position.set(-8, -5, 3);
        scene.add(fillLight);

        const rimLight = new THREE.SpotLight(0xffd700, CONFIG.lighting.rimLightIntensity, 0, 0.6, 1);
        rimLight.position.set(0, 8, 8);
        rimLight.castShadow = true;
        scene.add(rimLight);

        const accentLight = new THREE.PointLight(0x5a9b8a, CONFIG.lighting.accentIntensity);
        accentLight.position.set(0, -5, 2);
        scene.add(accentLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 0.8);
        backLight.position.set(0, 5, -5);
        scene.add(backLight);

        const dynamicLight1 = new THREE.PointLight(0xd4a574, 2.0, 50);
        dynamicLight1.position.set(5, 5, 5);
        scene.add(dynamicLight1);

        const dynamicLight2 = new THREE.PointLight(0x5a9b8a, 1.5, 50);
        dynamicLight2.position.set(-5, 5, 5);
        scene.add(dynamicLight2);

        const dynamicLight3 = new THREE.SpotLight(0xffd700, 2.5, 0, 0.4, 0.5);
        dynamicLight3.position.set(0, 10, 0);
        dynamicLight3.castShadow = true;
        scene.add(dynamicLight3);

        const dynamicLights = {
            light1: dynamicLight1,
            light2: dynamicLight2,
            light3: dynamicLight3
        };


        const groundGeometry = new THREE.CircleGeometry(30, 64);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            metalness: 0.3,
            roughness: 0.9,
            opacity: 0.5,
            transparent: true
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -5;
        ground.receiveShadow = true;
        scene.add(ground);


        
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);
        
        const fileSelector = document.getElementById('file-selector');
        const fileInput = document.getElementById('file-input');
        const selectBtn = document.getElementById('select-btn');
        const loadingDiv = document.getElementById('loading');
        const objLoader = new OBJLoader();
        
        const modelMaterial = new THREE.MeshStandardMaterial({
            color: CONFIG.material.color,
            metalness: CONFIG.material.metalness,
            roughness: CONFIG.material.roughness,
            emissive: CONFIG.material.emissive,
            emissiveIntensity: CONFIG.material.emissiveIntensity,
            side: THREE.DoubleSide
        });

        selectBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            fileSelector.classList.add('hidden');
            loadingDiv.classList.add('active');

            const reader = new FileReader();
            
            reader.onload = (e) => {
                try {
                    const contents = e.target.result;
                    const object = objLoader.parse(contents);
                    
                    while(modelGroup.children.length > 0) {
                        modelGroup.remove(modelGroup.children[0]);
                    }
                    
                    object.traverse((child) => {
                        if (child.isMesh) {
                            child.material = modelMaterial;
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    
                    object.position.set(
                        CONFIG.model.position.x,
                        CONFIG.model.position.y,
                        CONFIG.model.position.z
                    );
                    object.rotation.set(
                        CONFIG.model.rotation.x,
                        CONFIG.model.rotation.y,
                        CONFIG.model.rotation.z
                    );
                    object.scale.setScalar(CONFIG.model.scale);
                    
                    modelGroup.add(object);
                    
                    if (CONFIG.camera.autoAdjust) {
                        const box = new THREE.Box3().setFromObject(object);
                        const size = box.getSize(new THREE.Vector3());
                        const center = box.getCenter(new THREE.Vector3());
                        
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const fov = camera.fov * (Math.PI / 180);
                        let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                        cameraZ *= 2.5;
                        
                        camera.position.set(cameraZ * 0.4, cameraZ * 0.2, cameraZ);
                        controls.target.copy(center);
                        controls.update();
                    }
                    
                    loadingDiv.classList.remove('active');
                    
                    console.log('✅ Model loaded successfully');
                } catch (error) {
                    console.error('❌ Error loading OBJ:', error);
                    loadingDiv.classList.remove('active');
                    fileSelector.classList.remove('hidden');
                    selectBtn.textContent = 'Error - Try Again';
                    selectBtn.style.borderColor = '#ff6b6b';
                    selectBtn.style.color = '#ff6b6b';
                }
            };
            
            reader.readAsText(file);
        });


        
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            
            if (CONFIG.lighting.dynamicLightEnabled) {
                const radius = 8;
                const speed = 0.3;
                
                dynamicLights.light1.position.x = Math.cos(elapsedTime * speed) * radius;
                dynamicLights.light1.position.z = Math.sin(elapsedTime * speed) * radius;
                dynamicLights.light1.position.y = 5 + Math.sin(elapsedTime * speed * 0.5) * 2;
                
                dynamicLights.light2.position.x = Math.cos(elapsedTime * speed + Math.PI) * radius;
                dynamicLights.light2.position.z = Math.sin(elapsedTime * speed + Math.PI) * radius;
                dynamicLights.light2.position.y = 5 + Math.cos(elapsedTime * speed * 0.5) * 2;
                
                dynamicLights.light3.position.x = Math.sin(elapsedTime * 0.5) * 3;
                dynamicLights.light3.position.z = Math.cos(elapsedTime * 0.5) * 3;
            }
            
            if (CONFIG.model.autoRotate) {
                modelGroup.rotation.y += CONFIG.model.rotateSpeed;
            }
            
            if (CONFIG.animation.floatEnabled) {
                modelGroup.position.y = CONFIG.model.position.y + 
                    Math.sin(elapsedTime * CONFIG.animation.floatSpeed) * CONFIG.animation.floatAmount;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
